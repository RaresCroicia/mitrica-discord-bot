# NU comita secretul real. Creeaza-l direct in cluster cu:
#
#   kubectl -n bots create secret generic mitrica-env \
#     --from-literal=MITRICA_TOKEN='tokenul-de-discord' \
#     --from-literal=CLIENT_ID='application-id-ul-botului' \
#     --from-literal=GUILD_ID='id-ul-serverului-de-discord'
#
# MONGO_URL e optional: fara el botul porneste normal, doar /quote si
# /cuminvat raspund ca nu au baza de date. Cand apare Mongo, adaugi
# variabila in secret si dai rollout restart.
#
# sau copiaza fisierul asta in mitrica-secret.yaml (e in .gitignore),
# completeaza valorile si da kubectl apply -f k8s/mitrica-secret.yaml
apiVersion: v1
kind: Secret
metadata: { name: mitrica-env, namespace: bots }
stringData:
  MITRICA_TOKEN: "pune-tokenul-aici"
  CLIENT_ID: "application-id-ul-botului"
  GUILD_ID: "id-ul-serverului"
  # MONGO_URL: "mongodb://..."   # optional, vezi mai sus
